[project]
name = "tcal"
version = "0.1.0"
description = "A minimal, keyboard-based TUI calendar that syncs with iCloud."
requires-python = ">=3.11"
authors = [{ name = "Georg Slamanig" }]
license = "MIT"
readme = "README.md"
dependencies = [
    "caldav>=1.4.0",
    "click>=8.1.8",
    "icalendar>=6.0.0",
    "keyring>=25.0.0",
    "python-dateutil>=2.9.0.post0",
    "textual>=6.1.0",
]

[project.scripts]
tcal = "tcal.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.1",
    "textual-dev>=1.7.0",
    "types-python-dateutil>=2.9.0.20260124",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tcal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# An explicit set rather than ruff's defaults, so upgrades don't change the rules
select = [
  "E4", "E7", "E9", "F",  # pycodestyle errors + pyflakes
  "I",                    # import sorting
  "B",                    # bugbear: likely bugs
  "SIM",                  # simplifications
  "PIE",                  # unnecessary code
  "RUF100",               # stale noqa comments
]

[tool.mypy]
files = ["tcal", "tests"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
